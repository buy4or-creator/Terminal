name: Build Linux Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt6-base-dev libgl1-mesa-dev
      - name: Build Terminal for Linux
        run: |
          qmake6 console-v1.pro CONFIG+=release
          make -j$(nproc)
          mkdir -p dist/Terminal-Linux-x64
          cp console-v1 dist/Terminal-Linux-x64/Terminal
          cp app.ico dist/Terminal-Linux-x64/
          tar -czvf Terminal-Linux-x64.tar.gz -C dist Terminal-Linux-x64
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-Linux-x64
          path: Terminal-Linux-x64.tar.gz